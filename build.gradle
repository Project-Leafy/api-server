plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.leafy'
version = '0.0.1-SNAPSHOT'
description = '반려식물 키우기 앱'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // =================================================================
    // 1. 웹 & 유효성 검사 (Web Core)
    // =================================================================
    // 스프링 부트 웹 개발 필수요소 (Tomcat 내장, REST API 구현)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 입력값 검증 (@NotNull, @Email 등 사용) - 이상한 데이터 방어
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 앱 상태/메트릭 노출 (health, metrics) - 모니터링 수집용
    // 공개 포트(8080)가 아닌 별도 관리 포트로 분리해 내부망에만 노출한다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Prometheus 스크레이프용 메트릭 포맷 (/actuator/prometheus)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'


    // =================================================================
    // 2. 데이터베이스 & JPA (Persistence Layer)
    // =================================================================
    // 자바 객체와 DB 테이블을 연결해주는 표준 기술 (ORM)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL DB와 연결하기 위한 드라이버 (실행 시에만 필요)
    runtimeOnly 'org.postgresql:postgresql'

    // PostgreSQL의 JSONB 타입을 자바 엔티티에 쉽게 매핑해주는 유틸리티
    // (식물의 성장 기록이나 다양한 속성을 JSON으로 저장할 때 사용)
    implementation 'io.hypersistence:hypersistence-utils-hibernate-60:3.5.2'


    // =================================================================
    // 3. 보안 & 인증 (Security & Auth)
    // =================================================================
    // 스프링 시큐리티 핵심 라이브러리 (로그인, 권한 관리)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 소셜 로그인(구글, 카카오 등)을 위한 OAuth2 클라이언트
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // [JWT 토큰 관련 라이브러리]
    // - 컴파일/실행 모두 필요하여 implementation으로 설정 (버전 호환성 문제 해결)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'     // API 인터페이스
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.5'    // 구현체
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.5' // JSON 변환기


    // =================================================================
    // 4. 인프라 & 외부 연동 (Infra & External)
    // =================================================================
    // AWS S3 연동 (반려식물 사진 업로드 저장소)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.1'

    // WebClient (비동기 HTTP 클라이언트)
    // - 추후 추천 알고리즘 서버나 공공데이터 포털 API 호출 시 사용
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // .env 파일 로더 (DB 비밀번호, AWS 키 등 민감정보 보호)
    implementation 'io.github.cdimascio:java-dotenv:5.1.1'

    // [필수] XML 파싱을 위한 Jackson 확장 라이브러리
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // html 파싱 라이브러리
    implementation 'org.jsoup:jsoup:1.17.2'

    // =================================================================
    // 5. 문서화 & 코드 유틸리티 (Docs & Utils)
    // =================================================================
    // Swagger UI (API 명세서 자동 생성) - 최신 스프링 부트 3.x 호환 버전
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Lombok (반복 코드 제거) - 컴파일 시에만 관여하고 빠짐
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'


    // =================================================================
    // 6. 개발 및 테스트 전용 (Dev & Test Only) - 배포 시 제외됨
    // =================================================================
    // 개발 편의 도구 (서버 자동 재시작 등)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 인메모리 간편 DB (개발용 DB)
    runtimeOnly 'com.h2database:h2'

    // 테스트 코드 작성 및 실행 도구 (JUnit, Mockito 등)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test' // 시큐리티 관련 테스트
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // 테스트 실행 엔진
}

tasks.named('test') {
    useJUnitPlatform()
}
