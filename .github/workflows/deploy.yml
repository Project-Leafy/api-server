name: Deploy Backend to EC2

on:
  push:
    branches:
      - deploy/prod

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/leafy-backend
  DOCKER_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}   # 이거만 있으면 됨!!
          script: |
            sudo docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            sudo docker stop leafy-frontend || true
            sudo docker rm leafy-frontend || true
            sudo docker run -d --name leafy-frontend -p 80:80 ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}