# 1. 서버 기본 설정
server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      force: true

# 2. Swagger (SpringDoc) 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  default-consumes-media-type: application/json;charset=UTF-8

# --- 🔐 JWT 설정 ---
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000

# 3. Spring Boot 전체 설정
spring:
  application:
    name: leafy

  # ✨ [추가됨] data.sql 실행을 위한 설정
  sql:
    init:
      mode: always      # 항상 실행 (ON CONFLICT 덕분에 안전함)
      encoding: UTF-8   # 한글 깨짐 방지

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # (1) Jackson (JSON) 설정
  jackson:
    serialization:
      fail-on-empty-beans: false
    property-naming-strategy: SNAKE_CASE

  # (2) 데이터베이스(PostgreSQL) & JPA 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        default-batch-fetch-size: 100
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # --- OAuth2 Client 설정 ---
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: http://3.38.12.121/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# --- 외부 API 설정 ---
plant:
  id:
    api-key: ${PLANT_ID_API_KEY}
    base-url: https://plant.id/api/v3

cloudfront:
  url: ${CLOUDFRONT_URL}

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME}

# [핵심] 프론트엔드 리다이렉트 주소 설정
app:
  frontend-url: http://3.38.12.121/app/main/main.html   # ← 이 줄만 추가 (없으면 새로 써줘)
nongsaro:
  api-key: ${NONGSARO_API_KEY}
