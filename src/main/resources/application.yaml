spring:
  # 1. Spring Profile 설정 (로컬에서는 dev, 배포 시에는 prod 사용)

  profiles:
    active: dev # 로컬에서 실행 시 기본적으로 dev 프로필 활성화

  # 2. Spring Boot 전체 설정

  application:
    name: leafy

  # ✨ data.sql 실행을 위한 설정
  sql:
    init:
      mode: always      # 항상 실행 (ON CONFLICT 덕분에 안전함)
      encoding: UTF-8   # 한글 깨짐 방지

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # (1) Jackson (JSON) 설정
  jackson:
    serialization:
      fail-on-empty-beans: false
    property-naming-strategy: SNAKE_CASE

  # (2) 데이터베이스(PostgreSQL) & JPA 공통 설정
  datasource:
    driver-class-name: org.postgresql.Driver # 드라이버 클래스 이름은 공통
  jpa:
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        default-batch-fetch-size: 100
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # --- OAuth2 Client 공통 설정 ---
  security:
    oauth2:
      client:
        provider: # Provider 정보는 공통
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# --- 업로드 파일 저장소 (MinIO, S3 호환) ---
# 브라우저는 파일을 nginx 의 /files/ 경로로 받고, nginx 가 MinIO 로 넘긴다.
# 그래서 public-base-url 은 접속 주소와 무관한 상대 경로(/files)다.
app:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:leafy}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/files}
    # 기동 시 저장소에 없는 도감 이미지를 농사로 원본에서 복구한다.
    restore-plant-images: ${RESTORE_PLANT_IMAGES:true}

# 3. 서버 기본 설정
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

# 4. Swagger (SpringDoc) 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  default-consumes-media-type: application/json;charset=UTF-8

# --- 🔐 JWT 설정 ---
jwt:
  expiration: 86400000 # 토큰 만료 시간은 공통으로 사용


# --- 외부 API 공통 설정 ---
plant:
  id:
    base-url: https://plant.id/api/v3 # API 기본 URL은 공통
kma:
  api:
    url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst # 기상청 API URL
nongsaro: # Nongsaro API 설정 추가
  api:
    base-url: http://api.nongsaro.go.kr/service/garden/gardenList
    detail-url: http://api.nongsaro.go.kr/service/garden/gardenDtl
    image-base-url: http://www.nongsaro.go.kr/cms_contents/301/
kakao: # Kakao API 설정 추가
  api:
    base-url: https://kapi.kakao.com
  auth:
    base-url: https://kauth.kakao.com

logging:
  level:
    com.leafy: DEBUG
    ACCESS: INFO

  # --- 로그 포맷 ---
  # 비워두면 기존 텍스트 포맷, json 으로 바꾸면 한 줄 JSON으로 출력된다.
  # 수집 계층(fluentd)이 아직 텍스트를 파싱하고 있으므로, 양쪽 전환 시점을 맞추기 위해
  # 환경변수 LOG_FORMAT 하나로 켜고 끌 수 있게 했다.
  #   텍스트: (설정 없음, 기본값)
  #   JSON  : LOG_FORMAT=com.leafy.global.logging.LeafyJsonFormatter
  structured:
    format:
      console: ${LOG_FORMAT:}

  # 텍스트 포맷일 때의 타임스탬프. ISO8601 + offset 으로 통일한다.
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# --- 모니터링 (Actuator) ---
# 공개 포트(8080)에 붙이면 설정값·환경변수 이름 같은 민감한 정보가
# 사용자 트래픽과 같은 문으로 나간다. 별도 관리 포트로 분리해 내부망에만 노출한다.
# 이 포트는 컨테이너 밖(호스트)으로 publish 하지 않아야 한다.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. env/configprops 등은 민감해 기본적으로 닫아 둔다.
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when-authorized}