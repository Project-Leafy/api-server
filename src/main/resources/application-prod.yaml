# --- 🔐 JWT 설정 ---
jwt:
  secret: ${JWT_SECRET_KEY}

# 3. Spring Boot 전체 설정
spring:
  # (2) 데이터베이스(PostgreSQL) & JPA 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # 운영 환경에서는 validate 또는 none 으로 변경하는 것을 권장합니다.

  # --- OAuth2 Client 설정 ---
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: https://leafy-pr.com/login/oauth2/code/kakao # 배포 환경 리다이렉트 URI

# --- 외부 API 설정 ---
plant:
  id:
    api-key: ${PLANT_ID_API_KEY}

cloudfront:
  url: ${CLOUDFRONT_URL}

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME}

# [핵심] 프론트엔드 리다이렉트 주소 설정
app:
  frontend-url: https://leafy-pr.com/callback.html # 배포 환경 프론트엔드 URL
  cors-allowed-origins:
    - https://leafy-pr.com # 배포 환경 CORS 허용 출처

nongsaro:
  api-key: ${NONGSARO_API_KEY}
