# 경로: api-server/src/main/resources/application-dev.yaml

# ==================================
# 👩‍💻 'dev' 프로필 (개발용)
# ==================================
spring:
  config:
    activate:
      on-profile: dev

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # (1) JSON 설정: Snake Case 명시 (프론트엔드와 맞추기 위해)
  jackson:
    property-naming-strategy: SNAKE_CASE

  # (2) DB 설정: URL에서 ENCODING 제거됨 (오류 해결!)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:leafydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # (3) SQL 초기화 설정: 위치 수정 & 인코딩 추가 ✅
  # 주의: sql은 jpa 안이 아니라 spring 바로 아래에 있어야 합니다.
  sql:
    init:
      encoding: UTF-8  # 👈 이 줄이 있어야 data.sql 한글이 안 깨집니다!
      mode: always
      platform: h2

  h2:
    console:
      enabled: true
      path: /h2-console

  # (4) JPA 설정
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # AWS 설정
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false

# 외부 API 설정
plant:
  id:
    api-key: ${PLANT_ID_API_KEY}
    base-url: https://plant.id/api/v3

# CloudFront 설정
cloudfront:
  url: ${CLOUDFRONT_URL}

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME}