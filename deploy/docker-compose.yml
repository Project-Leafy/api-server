# Leafy 배포용 compose (Windows 데스크톱 + Tailscale)
#
# 도커허브에 올린 이미지를 받아 실행한다. 소스 빌드는 하지 않는다.
# PostgreSQL 은 Windows 에 직접 설치한 것을 쓴다(host.docker.internal).
# 처음 띄우는 순서는 같은 폴더의 README.md 를 따른다.
#
# 밖으로 여는 포트는 프론트(80) 하나이고, Tailscale IP 에만 연결한다.
# 백엔드(8080)·모니터링(9090)·MinIO(9000/9001)는 도커 내부망에서만 닿는다.

# 프로젝트 이름을 고정한다. 없으면 폴더 이름(deploy)이 붙어 볼륨이 deploy_minio_data 가 된다.
# 이 이름이 바뀌면 새 빈 볼륨이 만들어져 도감 이미지 217장을 다시 받는다.
name: leafy

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: leafy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      # 업로드 사진과 도감 이미지가 여기에 남는다. 이 볼륨을 지우면 사진이 사라진다.
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    # MinIO 관리 화면이 필요할 때만 주석을 풀어 이 PC 에서만 접속한다.
    # ports:
    #   - "127.0.0.1:9001:9001"

  backend:
    image: gicks/ai-ops-leafy-backend:${BACKEND_TAG:-latest}
    container_name: leafy-backend
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul

      # --- DB (Windows 에 설치한 PostgreSQL) ---
      SPRING_DATASOURCE_URL: "jdbc:postgresql://host.docker.internal:5432/leafy_dev"
      DB_USERNAME_DEV: ${DB_USERNAME}
      DB_PASSWORD_DEV: ${DB_PASSWORD}
      # dev 프로필 기본값(create-drop)은 종료할 때 테이블을 지운다. 배포에서는 유지한다.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # --- 인증 ---
      JWT_SECRET_KEY_DEV: ${JWT_SECRET_KEY}

      # --- 로그 ---
      # 백엔드 바로 앞 신뢰 프록시 = 프론트 nginx 의 고정 IP 하나.
      # 이 주소에서 온 요청만 X-Forwarded-For 를 오른쪽 끝부터 읽어 원 소스 IP를 구한다.
      # 네트워크 대역 전체를 넣지 말 것: 게이트웨이(10.203.0.1)가 포함되면 외부 요청 전부를 믿게 된다.
      TRUSTED_PROXIES: 10.203.0.10/32
      # 수집 계층(fluentd)의 line_format 을 json 으로 바꾸는 날 같이 켠다. 앱만 먼저 켜면 지금보다 더 안 읽힌다.
      # LOG_FORMAT: com.leafy.global.logging.LeafyJsonFormatter

      # --- 저장소 (MinIO) ---
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: leafy
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_PUBLIC_BASE_URL: /files

      # --- 접속 주소 ---
      CORS_ALLOWED_ORIGINS: http://${TAILSCALE_IP}

      # --- 외부 API (없으면 해당 기능만 동작하지 않는다) ---
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NONGSARO_API_KEY: ${NONGSARO_API_KEY:-}
      AIR_PURIFIY_KEY: ${AIR_PURIFIY_KEY:-}
      OPEN_WEATHER_API_KEY: ${OPEN_WEATHER_API_KEY:-}

  frontend:
    image: gicks/ai-ops-leafy-frontend:${FRONTEND_TAG:-latest}
    container_name: leafy-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - minio
    environment:
      TZ: Asia/Seoul
      # nginx 앞의 신뢰 프록시(set_real_ip_from). 지금은 nginx 앞에 아무것도 없으므로 비워 둔다.
      # 신뢰 판단은 백엔드 한 곳(TRUSTED_PROXIES)에서만 한다. 판단 지점이 둘이면 한쪽만 틀려도 뚫린다.
      # 나중에 AIOps 스택의 nginx 가 앞에 붙으면, 그 nginx 의 고정 IP 를 여기와 백엔드 양쪽에 추가한다.
      TRUSTED_PROXIES: ""
    networks:
      default:
        # 백엔드 TRUSTED_PROXIES 와 짝을 이루는 고정 IP
        ipv4_address: 10.203.0.10
    ports:
      # Tailscale IP 에만 연결해 같은 tailnet 의 팀원만 접속하게 한다.
      - "${TAILSCALE_IP}:80:80"

# 신뢰 프록시를 고정 IP 로 지정하기 위해 대역을 고정한다.
# 172.16~31 대역은 Windows WSL2 가 임의로 쓰는 경우가 있어 피했다.
networks:
  default:
    ipam:
      config:
        - subnet: 10.203.0.0/24

volumes:
  minio_data:
